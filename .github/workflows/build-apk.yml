name: Build Sathi AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Create signing keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore sathiai-release.jks \
            -alias sathiai \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass sathiai123 \
            -keypass sathiai123 \
            -dname "CN=Sathi AI, OU=SathiAI, O=SathiAI, L=Unknown, ST=Unknown, C=NP"

      - name: Find Android Build Tools
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_ENV"

      - name: Align APK
        run: |
          "$BUILD_TOOLS/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Sign APK
        run: |
          "$BUILD_TOOLS/apksigner" sign \
            --ks sathiai-release.jks \
            --ks-key-alias sathiai \
            --ks-pass pass:sathiai123 \
            --key-pass pass:sathiai123 \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Verify APK signature
        run: |
          "$BUILD_TOOLS/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SathiAI-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
